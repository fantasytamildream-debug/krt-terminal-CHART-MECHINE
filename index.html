.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.modal .box{max-height:88vh;overflow:auto;max-width:560px}
.cvwrap.fs{position:fixed;inset:0;height:100vh!important;height:100dvh!important;z-index:90;border-radius:0;border:0}
body.noscroll{overflow:hidden}

function tradingDatesBefore(d,n){const a=[];let t=d-864e5;while(a.length<n){const w=new Date(t).getUTCDay();if(w&&w!==6)a.push(t);t-=864e5}return a.reverse()}
function genDay(r,sym,day,o,c,sd){
  const{open,len}=sym.sess,sm=sd/Math.sqrt(len)*1.15,reg=r(),drift=reg<.35?(r()<.5?1:-1)*sd*.9/len:0,tick=sym.px<100?.01:.05;
  const path=[o];let x=o;for(let i=0;i<len;i++){let ret=gauss(r)*sm+drift;if(reg>.35&&reg<.7)ret-=(x-o)/o*.015;if(r()<.004)ret+=gauss(r)*sm*4;x*=1+ret;path.push(x)}

    const u=(2*i/len-1),mv=Math.abs(bc-bo)/(bo*sm);
    bars.push({t:day+(open+i)*6e4,o:bo,h:rt(Math.max(bo,bc)+ex*r(),tick),l:rt(Math.min(bo,bc)-ex*r(),tick),c:bc,v:Math.round(sym.vb*(.55+1.5*u*u)*Math.exp(gauss(r)*.35)*(1+mv*.35))})}

  const N=260,dates=tradingDatesBefore(D0,N),rets=[];for(let i=0;i<N;i++)rets.push(gauss(r)*sd+(r()-.5)*.0006);
  const c=new Array(N);c[N-1]=prev;for(let i=N-1;i>0;i--)c[i-1]=c[i]/(1+rets[i]);
  sym.daily=dates.map((t,i)=>{const pc=i?c[i-1]:c[0]/(1+rets[0]),o=pc*(1+gauss(r)*sd*.25);return{t,o,h:Math.max(o,c[i])*(1+Math.abs(gauss(r))*sd*.5),l:Math.min(o,c[i])*(1-Math.abs(gauss(r))*sd*.5),c:c[i],v:Math.round(sym.vb*sym.sess.len*Math.exp(gauss(r)*.3))}});
  sym.intra=[];

}

function aggregate(bars,tf,sess){const out=[];let cur=null;for(const b of bars){const d=dayStart(b.t),m=(b.t-d)/6e4,k=d+(sess.open+Math.floor((m-sess.open)/tf)*tf)*6e4;
  if(!cur||cur.t!==k){cur={t:k,o:b.o,h:b.h,l:b.l,c:b.c,v:b.v,te:Math.min(k+tf*6e4,d+(sess.open+sess.len)*6e4)};out.push(cur)}else{cur.h=Math.max(cur.h,b.h);cur.l=Math.min(cur.l,b.l);cur.c=b.c;cur.v+=b.v}}return out}

function todayBar(sym){const e=el(sym),bs_=sym.today.slice(0,e);if(hasPartial(sym))bs_.push(partial(sym));if(!bs_.length)return null;const a=aggDays(bs_)[0];if(e<sym.sess.len)a.partial=true;return a}

  const e=el(sym),key=sym.s+'|'+tf+'|'+e+'|'+(sym.ver||0);let comp=CACHE.get(key);

      if(lb&&lb.t===k)out[out.length-1]={...lb,h:Math.max(lb.h,p.h),l:Math.min(lb.l,p.l),c:p.c,v:lb.v+p.v};

      if(lb&&lb.t===k)out[out.length-1]={...lb,h:Math.max(lb.h,tb.h),l:Math.min(lb.l,tb.l),c:tb.c,v:lb.v+tb.v,partial:true};else out.push({...tb,t:k,partial:true})}}
  }

function getTFcsv(sym,tf){const key=sym.s+'|csv|'+tf+'|'+(sym.ver||0);let o=CACHE.get(key);if(o)return o;const B=sym.csv.bars,base=sym.csv.base;
  if(TFM[tf]){o=base<=TFM[tf]&&base<1440?aggregate(B,TFM[tf],sym.sess):[]}else{const days=base>=1440?B:aggDays(B);o=tf==='1D'?days:aggMonths(days)}

const complete=b=>b.filter(x=>!x.partial);

/* ---------------- INDICATORS & ANALYSIS ---------------- */
function ema(a,n){const k=2/(n+1);let e=a[0];return a.map((x,i)=>i?(e=x*k+e*(1-k)):e)}
function rsiArr(c,n=14){const o=new Array(c.length).fill(50);let g=0,l=0;for(let i=1;i<c.length;i++){const d=c[i]-c[i-1];if(i<=n){g+=Math.max(d,0);l+=Math.max(-d,0);if(i===n){g/=n;l/=n;o[i]=100-100/(1+g/(l||1e-9))}}else{g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n;o[i]=100-100/(1+g/(l||1e-9))}}return o}
function atrArr(b,n=14){const o=[];let a=0;for(let i=0;i<b.length;i++){const tr=i?Math.max(b[i].h-b[i].l,Math.abs(b[i].h-b[i-1].c),Math.abs(b[i].l-b[i-1].c)):b[i].h-b[i].l;a=i<n?(a*i+tr)/(i+1):(a*(n-1)+tr)/n;o.push(a)}return o}
function vwapArr(b){let pv=0,vv=0,d=-1;return b.map(x=>{const k=dayStart(x.t);if(k!==d){d=k;pv=0;vv=0}const tp=(x.h+x.l+x.c)/3;pv+=tp*x.v;vv+=x.v;return vv?pv/vv:tp})}
// Swing points: a swing at i is CONFIRMED only after k completed bars on its right (no future data at decision time).
function swings(b,k=2){const o=[];for(let i=k;i<b.length-k;i++){let H=true,L=true;for(let j=i-k;j<=i+k;j++){if(j===i)continue;if(b[j].h>=b[i].h)H=false;if(b[j].l<=b[i].l)L=false}if(H)o.push({i,type:'H',p:b[i].h,conf:i+k});if(L)o.push({i,type:'L',p:b[i].l,conf:i+k})}return o}
function cluster(levels,tol){const s=[...levels].sort((a,b)=>a-b),o=[];for(const x of s){const l=last(o);if(l&&Math.abs(x-l.p)<=tol){l.p=(l.p*l.n+x)/(l.n+1);l.n++}else o.push({p:x,n:1})}return o}

  if(body>=.75*rg&&rg>=1.5*atr)return{n:c.c>c.o?'Bullish displacement':'Bearish displacement',s:c.c>c.o?1:-1};
  if(p.c<p.o&&c.c>c.o&&c.c>=p.o&&c.o<=p.c)return{n:'Bullish engulfing',s:1};
  if(p.c>p.o&&c.c<c.o&&c.c<=p.o&&c.o>=p.c)return{n:'Bearish engulfing',s:-1};
  if(lo>=2*body&&up<=body*.7&&rg>.6*atr)return{n:'Hammer',s:1};
  if(up>=2*body&&lo<=body*.7&&rg>.6*atr)return{n:'Shooting star',s:-1};
  if(body<=.1*rg)return{n:'Doji',s:0};
  if(c.h<p.h&&c.l>p.l)return{n:'Inside bar',s:0};

function analyze(b,opt={}){
  const n=b.length;if(n<(opt.min||25))return{ok:false,n};
  const c=b.map(x=>x.c),e20=ema(c,20),e50=ema(c,50),R=rsiArr(c),A=atrArr(b),L_=b[n-1],P_=b[n-2],atr=A[n-1];

/* ---------------- OPTION CHAIN (synthetic model for demo feed) ---------------- */
function oiModel(sym,K,type,S,frac){const S0=sym.prevClose,st=sym.step,w=st*6,ctr=type==='CE'?S0+st*3:S0-st*3;

  const d=Math.abs(S/sym.prevClose-1)/(sym.iv/Math.sqrt(252));const atmIv=sym.iv*(1+.05*d);
  const iv=clamp(atmIv*(1+(sym.seg==='IDX'?300:60)*m*m)*(1-1.2*m),.05,2);const r=bs(S,K,T,iv,type);
  const ltpv=Math.max(.05,r.p),om=oiModel(sym,K,type,S,e/len),prox=Math.exp(-Math.abs(K-S)/(sym.step*3)),rel=sym.spr*(1+3*(1-prox)),half=Math.max(.05,ltpv*rel/2);

const atmOf=(sym,S)=>Math.round(S/sym.step)*sym.step;

function dataCheck(sym,needChain){const iss=[];const b=getTF(sym,'5m'),lb=last(complete(b));
  if(!lb)iss.push('no completed candles');
  else{for(const x of complete(b).slice(-30))if(!(x.h>=Math.max(x.o,x.c)&&x.l<=Math.min(x.o,x.c)&&x.l>0)){iss.push('invalid OHLC');break}
    if(!sym.csv&&!isLive(sym)){const age=(clockMs()-(lb.te||lb.t))/1e3;const sessEnd=D0+(sym.sess.open+sym.sess.len)*6e4;if(clockMs()<sessEnd&&age>CFG.staleSec+300)iss.push('stale underlying ('+Math.round(age)+'s)')}}
  if(needChain&&sym.csv)iss.push('option chain is synthetic while price is CSV — blocked');
  if(isLive(sym))liveCheck(sym,needChain,iss);
  if(needChain&&!sym.csv&&!isLive(sym)){const ch=chainNow(sym);if(Math.abs(ch.t-nowMs(sym))>6e4)iss.push('quote/underlying timestamps out of sync')}

/* AI direction: k-nearest historical analogs (walk-forward, no future data) */
function analog(bars,H=8,K=30,bt=true){const n=bars.length;K=Math.min(K,Math.floor((n-40-H)/2));if(K<12)return null;const c=bars.map(b=>b.c),R=rsiArr(c),A=atrArr(bars),E=ema(c,20),hasV=bars.some(b=>b.v>0),F=new Array(n);
  for(let i=25;i<n;i++){const a=(A[i]/c[i])||1e-9,va=hasV?avg(bars.slice(i-20,i).map(x=>x.v)):0;F[i]=[(c[i]/c[i-1]-1)/a,(c[i]/c[i-5]-1)/a/2.2,(c[i]/c[i-20]-1)/a/4.5,(R[i]-50)/15,(c[i]-E[i])/(A[i]||1e-9)/2,hasV&&va?clamp(Math.log((bars[i].v||1)/va),-2,2):0]}
  const proj=at=>{const q=F[at],d=[];for(let j=25;j+H<=at;j++){const f=F[j];let s=0;for(let k=0;k<6;k++){const z=q[k]-f[k];s+=z*z}d.push([s,j])}if(d.length<K*2)return null;d.sort((a,b)=>a[0]-b[0]);
    const fw=d.slice(0,K).map(x=>c[x[1]+H]/c[x[1]]-1).sort((a,b)=>a-b);return{up:fw.filter(x=>x>0).length/K,mean:avg(fw),p25:fw[Math.floor(K*.25)],p75:fw[Math.floor(K*.75)]}};
  const cur=proj(n-1);if(!cur)return null;let hits=0,tot=0;
  if(bt)for(let at=Math.max(25+K*2+H,n-1-H-80);at<=n-1-H;at++){const p=proj(at);if(!p||(p.up<.6&&p.up>.4))continue;tot++;const r=c[at+H]/c[at]-1;if((p.up>=.6&&r>0)||(p.up<=.4&&r<0))hits++}
  return Object.assign(cur,{H,K,bt:{hits,tot}})}
const tfH={'3m':10,'5m':8,'15m':6,'1h':5,'1D':5,'1M':3};
function analogFor(key,bars,tf){const lb=last(bars),k=key+'|'+tf+'|'+bars.length+'|'+(lb?lb.t:0);if(ANC[k]!==undefined)return ANC[k];const v=analog(bars.slice(-400),tfH[tf]||6)||fallbackArrow(bars.slice(-400),tfH[tf]||6);ANC[k]=v;const ks=Object.keys(ANC);if(ks.length>200)delete ANC[ks[0]];return v}
const aiDir=p=>!p?null:p.up>=.6?1:p.up<=.4?-1:0;
function aiTrackScan(){for(const s of tradables()){const b=complete(getTF(s,'15m'));if(b.length<120)continue;const lt=last(b).t;if(AIPC[s.s]===lt)continue;AIPC[s.s]=lt;const key='A|'+s.s+'|'+lt;if(AITR.some(a=>a.key===key))continue;
    const p=analog(b.slice(-400),4,30,false);if(!p||!aiDir(p))continue;AITR.unshift({key,sym:s.s,t:lt,dir:aiDir(p),c0:last(b).c,H:4,up:p.up,st:'OPEN',feed:feedTag(s)});if(AITR.length>1500)AITR.pop()}
  for(const a of AITR){if(a.st!=='OPEN')continue;const s=SYM[a.sym];if(!s)continue;const b=complete(getTF(s,'15m'));let i=b.length-1;while(i>=0&&b[i].t>a.t)i--;if(i<0||b[i].t!==a.t||i+a.H>=b.length)continue;const r=b[i+a.H].c/a.c0-1;a.st=Math.sign(r)===a.dir?'HIT':'MISS';a.r=r*100}}

  let upFirst=0,dnFirst=0,mfe=[],mae=[];for(const[,j]of d.slice(0,K)){let hiM=-1e9,loM=1e9,res=0;for(let k=1;k<=H;k++){const b=bars[j+k];hiM=Math.max(hiM,b.h);loM=Math.min(loM,b.l);if(!res){const dn=b.l<=c[j]-A[j],up=b.h>=c[j]+A[j];if(dn)res=-1;else if(up)res=1}}if(res>0)upFirst++;else if(res<0)dnFirst++;mfe.push(hiM/c[j]-1);mae.push(loM/c[j]-1)}

  if(d.sp){const[k,p]=d.sp.split('|'),old=STRAT[k].p[p];STRAT[k].p[p]=typeof old==='number'?(isFinite(parseFloat(t.value))?parseFloat(t.value):old):t.value;sv('krt_strat',STRAT);rescan();if(view.tab==='strat')renderStrats($('#main'))}
  if(d.sf){const[k,f]=d.sf.split('|');STRAT[k].f[f]=t.checked;sv('krt_strat',STRAT);rescan();renderStrats($('#main'))}
  if(d.ev){const[i,f]=d.ev.split('|');EVENTS[i][f]=f==='dow'?parseInt(t.value):t.value;sv('krt_events',EVENTS);rescan()}});
function modal(h){$('#mbox').innerHTML=h;$('#modal').classList.add('show')}
function rescan(){scanAll()}
window.addEventListener('resize',()=>drawChart());

/* ---------- MAIN LOOP ---------- */
function onMinute(){scanAll();if(view.tab==='chart')renderChartPanels();else if(view.tab==='mkt')renderMkList();else if(view.tab==='calls')renderCalls($('#main'));else if(view.tab==='jrnl')renderJournal()}
let lastFrame=0;
function tick(){if(LIVE.on){const mm=Math.floor(istNow()/6e4);if(mm!==LIVE.lastMin){LIVE.lastMin=mm;onMinute()}}else if(S.run&&S.clock<1410){S.sub+=250/(1500/S.speed);if(S.sub>=1){S.sub=0;S.clock++;onMinute()}}
  if(!LIVE.on&&S.clock>=1410&&S.run){S.run=false;$('#pp').textContent='▶'}
  renderTicker();updatePositions();
  if(view.tab==='chart'){drawChart();if(!view.opt||true){const n=Date.now();if(n-lastFrame>1000){lastFrame=n;renderChartHead()}}}
  else if(view.tab==='mkt'&&Date.now()-lastFrame>1000){lastFrame=Date.now();renderMkList()}}
// apply saved calibrations
try{const c=ld('krt_calib',{});for(const k in c){const s=SYM[k];if(!s)continue;const f=c[k];const sc=b=>{b.o*=f;b.h*=f;b.l*=f;b.c*=f};s.daily.forEach(sc);s.intra.forEach(sc);s.today.forEach(sc);s.prevClose*=f;s.px*=f}}catch(e){}
try{const L=ld('krt_lots',{});for(const k in L)if(SYM[k])SYM[k].lot=L[k]}catch(e){}
POS=POS.filter(p=>SYM[p.sym]);
scanAll();renderTicker();renderMood();go('mkt');setInterval(tick,250);
setInterval(liveLoop,1000);
if(window.KRT_SAME_ORIGIN){LIVE.url=location.origin;if(!window.KRT_NEEDS_KEY||LIVE.key)connectLive();else{go('set');setTimeout(()=>{const e=$('#lvState');if(e)e.innerHTML='<span class="ac">Enter your ACCESS_KEY above and tap Connect live.</span>'},50)}}
else if(LIVE.url&&LIVE.auto)connectLive();
</script>
</body>
